<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Черная Дыра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        /* UI Панель */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            padding: 20px;
            background: rgba(10, 10, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            z-index: 10;
        }

        .ui-panel.collapsed {
            transform: translateX(-360px);
            opacity: 0.2;
        }

        .ui-toggle {
            position: absolute;
            top: 20px;
            right: -45px;
            width: 35px;
            height: 35px;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .control-group span {
            color: #818cf8;
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            accent-color: #6366f1;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        select option {
            background: #0f172a;
            color: #fff;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="ui-panel" id="panel">
        <button class="ui-toggle" id="toggleBtn">⚙️</button>
        <h1>Черная Дыра</h1>
        
        <div class="control-group">
            <label>Масса (Гравитация) <span id="massVal">1500</span></label>
            <input type="range" id="mass" min="500" max="4000" value="1500">
        </div>

        <div class="control-group">
            <label>Количество частиц <span id="countVal">3000</span></label>
            <input type="range" id="count" min="500" max="6000" step="100" value="3000">
        </div>

        <div class="control-group">
            <label>Скорость вращения <span id="speedVal">1.2</span></label>
            <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.2">
        </div>

        <div class="control-group">
            <label>Цветовая гамма</label>
            <select id="palette">
                <option value="supernova">Супернова (Огонь / Золото)</option>
                <option value="violet">Ультрафиолет (Фиолетовый / Неон)</option>
                <option value="cyan">Неоновый Океан (Голубой / Синий)</option>
                <option value="emerald">Изумрудный Космос</option>
                <option value="mono">Монохром</option>
            </select>
        </div>
    </div>

    <div class="hint">Водите мышкой или пальцем для управления • Кликните для гравитационной волны</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Элементы управления
        const panel = document.getElementById('panel');
        const toggleBtn = document.getElementById('toggleBtn');
        const massInput = document.getElementById('mass');
        const countInput = document.getElementById('count');
        const speedInput = document.getElementById('speed');
        const paletteSelect = document.getElementById('palette');

        let width, height;
        let particles = [];
        let shockwaves = [];

        // Настройки по умолчанию
        const settings = {
            mass: 1500,
            particleCount: 3000,
            rotationSpeed: 1.2,
            palette: 'supernova'
        };

        // Цветовые палитры
        const palettes = {
            supernova: ['#ff4500', '#ffa500', '#ffeb3b', '#ffffff'],
            violet: ['#4a00e0', '#8e2de2', '#d442f5', '#ffffff'],
            cyan: ['#00d2ff', '#3a7bd5', '#00f2fe', '#ffffff'],
            emerald: ['#059669', '#10b981', '#34d399', '#ffffff'],
            mono: ['#475569', '#94a3b8', '#e2e8f0', '#ffffff']
        };

        // Позиция черной дыры (следует за курсором)
        const hole = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            radius: 25,
            pulse: 0
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (hole.x === 0 && hole.y === 0) {
                hole.x = hole.targetX = width / 2;
                hole.y = hole.targetY = height / 2;
            }
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                const angle = Math.random() * Math.PI * 2;
                const dist = initial 
                    ? Math.random() * Math.max(width, height) * 0.8 + 50
                    : Math.max(width, height) * (0.5 + Math.random() * 0.3);

                this.x = hole.x + Math.cos(angle) * dist;
                this.y = hole.y + Math.sin(angle) * dist;

                // Орбитальная скорость
                const orbitSpeed = (Math.random() * 2 + 1) * settings.rotationSpeed;
                this.vx = -Math.sin(angle) * orbitSpeed;
                this.vy = Math.cos(angle) * orbitSpeed;

                this.size = Math.random() * 1.8 + 0.6;
                this.colors = palettes[settings.palette];
                this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
                this.life = 1;
            }

            update() {
                const dx = hole.x - this.x;
                const dy = hole.y - this.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Поглощение черной дырой
                if (dist < hole.radius) {
                    hole.pulse = Math.min(hole.pulse + 0.05, 8);
                    this.reset();
                    return;
                }

                // Сила притяжения (Закон тяготения)
                const force = settings.mass / (distSq + 100);
                const ax = (dx / dist) * force;
                const ay = (dy / dist) * force;

                // Танангенциальное ускорение (закручивание)
                const spinForce = force * 0.5 * settings.rotationSpeed;
                const tx = (-dy / dist) * spinForce;
                const ty = (dx / dist) * spinForce;

                this.vx += ax + tx;
                this.vy += ay + ty;

                // Сопротивление среды около центра
                this.vx *= 0.985;
                this.vy *= 0.985;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = hole.radius;
                this.maxRadius = 300;
                this.alpha = 1;
            }

            update() {
                this.radius += 12;
                this.alpha -= 0.03;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha * 0.5})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < settings.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // Эффект шлейфа (Motion Blur)
            ctx.fillStyle = 'rgba(3, 3, 8, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Плавное движение черной дыры за курсором
            hole.x += (hole.targetX - hole.x) * 0.08;
            hole.y += (hole.targetY - hole.y) * 0.08;

            if (hole.pulse > 0) hole.pulse -= 0.2;
            const currentRadius = hole.radius + Math.max(0, hole.pulse);

            // 1. Ореол аккреционного диска (Свечение)
            const glowGradient = ctx.createRadialGradient(
                hole.x, hole.y, currentRadius * 0.8,
                hole.x, hole.y, currentRadius * 4
            );
            const activePalette = palettes[settings.palette];
            glowGradient.addColorStop(0, activePalette[0]);
            glowGradient.addColorStop(0.4, activePalette[1] + '44');
            glowGradient.addColorStop(1, 'transparent');

            ctx.beginPath();
            ctx.arc(hole.x, hole.y, currentRadius * 4, 0, Math.PI * 2);
            ctx.fillStyle = glowGradient;
            ctx.fill();

            // 2. Обновление и отрисовка частиц
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            // 3. Ударные волны
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                shockwaves[i].update();
                shockwaves[i].draw();
                if (shockwaves[i].alpha <= 0) {
                    shockwaves.splice(i, 1);
                }
            }

            // 4. Тень Горизонта Событий (Черное ядро)
            ctx.beginPath();
            ctx.arc(hole.x, hole.y, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Яркий ободок гравитационного линзирования
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = activePalette[2];
            ctx.stroke();

            requestAnimationFrame(animate);
        }

        // События ввода
        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', (e) => {
            hole.targetX = e.clientX;
            hole.targetY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                hole.targetX = e.touches[0].clientX;
                hole.targetY = e.touches[0].clientY;
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('#panel')) return;
            
            shockwaves.push(new Shockwave(hole.x, hole.y));

            // Импульс расталкивания частиц
            for (let p of particles) {
                const dx = p.x - hole.x;
                const dy = p.y - hole.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 300 && dist > 0) {
                    const force = (300 - dist) * 0.15;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            }
        });

        // Слушатели панели настроек
        toggleBtn.addEventListener('click', () => {
            panel.classList.toggle('collapsed');
        });

        massInput.addEventListener('input', (e) => {
            settings.mass = parseFloat(e.target.value);
            document.getElementById('massVal').innerText = settings.mass;
        });

        countInput.addEventListener('input', (e) => {
            settings.particleCount = parseInt(e.target.value);
            document.getElementById('countVal').innerText = settings.particleCount;
            initParticles();
        });

        speedInput.addEventListener('input', (e) => {
            settings.rotationSpeed = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = settings.rotationSpeed;
        });

        paletteSelect.addEventListener('change', (e) => {
            settings.palette = e.target.value;
            const colors = palettes[settings.palette];
            for (let p of particles) {
                p.colors = colors;
                p.color = colors[Math.floor(Math.random() * colors.length)];
            }
        });

        // Старт
        resize();
        initParticles();
        animate();
    </script>
</body>
</html>
