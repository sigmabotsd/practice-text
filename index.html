<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Text ✨</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #03040b;
  color: white;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.panel {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 540px);
  text-align: center;
}

h1 {
  font-size: 28px;
  letter-spacing: 5px;
  color: #74f5ff;
  text-shadow: 0 0 20px #00bfff;
  margin: 0 0 18px;
}

.controls {
  display: flex;
  gap: 8px;
}

input, button {
  border: 1px solid #225d88;
  background: #091323;
  color: white;
  padding: 12px;
  border-radius: 9px;
  font-size: 15px;
}

input {
  flex: 1;
  min-width: 0;
}

button {
  cursor: pointer;
  background: #07344b;
}

button:hover {
  background: #075475;
}

.hint {
  color: #8da9c8;
  font-size: 13px;
  margin-top: 12px;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<div class="panel">
  <h1>PARTICLE TEXT</h1>
  <div class="controls">
    <input id="word" maxlength="24"
      value="MAXYWORLD" placeholder="Введи текст">
    <button id="form">Создать ✨</button>
  </div>
  <div class="hint">
    Двигай мышью • Нажми для взрыва • Введи свой текст
  </div>
</div>

<script>
const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const input = document.querySelector("#word");
const button = document.querySelector("#form");

let W, H, dpr;
let particles = [];
let targets = [];
let mouse = { x: -1000, y: -1000 };
let lastBuild = 0;

const COUNT = 2200;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildText();
}

function buildText() {
  const off = document.createElement("canvas");
  const o = off.getContext("2d");

  off.width = Math.floor(W * 0.94);
  off.height = Math.floor(H * 0.65);

  const word = (input.value.trim() || "MAXYWORLD")
    .toUpperCase();

  let fontSize = Math.min(
    off.width / Math.max(word.length * 0.68, 1),
    off.height * 0.48,
    150
  );

  o.textAlign = "center";
  o.textBaseline = "middle";
  o.font = `900 ${fontSize}px Arial`;
  o.fillStyle = "white";
  o.fillText(word, off.width / 2, off.height / 2);

  // Уменьшаем изображение текста для поиска пикселей
  const data = o.getImageData(
    0, 0, off.width, off.height
  ).data;

  const points = [];
  const step = W < 600 ? 5 : 4;

  for (let y = 0; y < off.height; y += step) {
    for (let x = 0; x < off.width; x += step) {
      const index = (y * off.width + x) * 4;

      if (data[index + 3] > 100) {
        points.push({
          x: W / 2 - off.width / 2 + x,
          y: H / 2 - off.height / 2 + y + 20
        });
      }
    }
  }

  // Перемешиваем точки, чтобы заполнить текст частицами
  for (let i = points.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [points[i], points[j]] = [points[j], points[i]];
  }

  targets = [];

  for (let i = 0; i < COUNT; i++) {
    if (points.length) {
      targets.push(points[i % points.length]);
    } else {
      targets.push({ x: W / 2, y: H / 2 });
    }
  }

  // Если это первое построение, создаём частицы
  if (!particles.length) {
    particles = targets.map((t, i) => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      size: 0.7 + Math.random() * 1.6,
      hue: 175 + Math.random() * 65,
      phase: Math.random() * Math.PI * 2
    }));
  }

  lastBuild = performance.now();
}

function burst(x, y) {
  for (const p of particles) {
    let dx = p.x - x;
    let dy = p.y - y;
    let dist = Math.hypot(dx, dy) || 1;

    // Частицы разлетаются от точки клика
    const force = 12 + Math.random() * 15;
    p.vx += dx / dist * force;
    p.vy += dy / dist * force;
  }
}

canvas.addEventListener("pointermove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener("pointerleave", () => {
  mouse.x = -1000;
  mouse.y = -1000;
});

canvas.addEventListener("pointerdown", e => {
  burst(e.clientX, e.clientY);
});

button.addEventListener("click", buildText);
input.addEventListener("keydown", e => {
  if (e.key === "Enter") buildText();
});

window.addEventListener("resize", resize);

function animate(time) {
  ctx.clearRect(0, 0, W, H);

  // Лёгкий шлейф для красивого движения
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const t = targets[i];

    // Частицы стремятся занять места, образующие буквы
    p.vx += (t.x - p.x) * 0.018;
    p.vy += (t.y - p.y) * 0.018;

    // Курсор отталкивает частицы
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 100 && dist > 0) {
      const force = (100 - dist) / 100;
      p.vx += dx / dist * force * 2.7;
      p.vy += dy / dist * force * 2.7;
    }

    // Небольшое свечение и дрожание
    p.vx *= 0.90;
    p.vy *= 0.90;
    p.x += p.vx;
    p.y += p.vy;

    const pulse = 0.7 +
      0.3 * Math.sin(time * 0.002 + p.phase);

    ctx.beginPath();
    ctx.arc(
      p.x, p.y,
      p.size * pulse,
      0, Math.PI * 2
    );

    ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, 0.9)`;
    ctx.shadowBlur = 9;
    ctx.shadowColor = "#00cfff";
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}

resize();
animate(0);
</script>
</body>
</html>
